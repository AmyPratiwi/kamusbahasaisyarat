    /* =================================================================
       UTILITAS
       ================================================================= */
    // Acak array (Fisher-Yates) — seeded agar konsisten per huruf
    function shuffle(arr, seed) {
      const a = [...arr];
      let s = seed || 1;
      function rng() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Ambil subset unik berdasarkan properti (menghindari duplikat terjemahan)
    function uniqueBy(arr, key) {
      const seen = new Set();
      return arr.filter(item => {
        const val = item[key];
        if (seen.has(val)) return false;
        seen.add(val);
        return true;
      });
    }

       BACA PARAMETER URL & BAHASA
       ================================================================= */

    const letter = (params.get('huruf') || params.get('letter') || 'A').toUpperCase();
    const lkpdNo = parseInt(params.get('no')) || 1;
    let currentLang = params.get('lang') || localStorage.getItem('kolok_app_lang') || 'id';
    if (currentLang !== 'id' && currentLang !== 'en') currentLang = 'id';

    const allWords = DICTIONARY_DATA.filter(w => w.letter === letter);
    // Buat set unik untuk latihan mencocokkan (hindari duplikat indo)
    const uniqueWords = uniqueBy(allWords, 'indo');

    function toggleLkpdLanguage() {
      currentLang = (currentLang === 'id') ? 'en' : 'id';
      try {
        localStorage.setItem('kolok_app_lang', currentLang);
      } catch (e) {}
      const url = new URL(window.location.href);
      url.searchParams.set('lang', currentLang);
      window.history.replaceState({}, '', url);
      build();

      const indToEng = transItems.slice(half);

      html += `
      <div class="worksheet-card bg-white rounded-3xl border-2 border-slate-300 overflow-hidden shadow-md mb-8 ${uniqueWords.length >= 3 ? '' : 'print-break'}">
        <div class="bg-gradient-to-r from-violet-600 to-purple-600 text-white px-5 sm:px-6 py-4 flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center font-bold text-lg flex-shrink-0">${uniqueWords.length >= 3 ? '3' : '2'}</div>
          <div>
            <h2 class="font-bold text-base sm:text-lg">${t.ex3Title}</h2>
            <p class="text-xs text-violet-200 mt-0.5 leading-relaxed">${t.ex3Desc}</p>
          </div>
        </div>
        <div class="p-5 sm:p-6">`;

      if (engToInd.length > 0) {
        html += `
          <h3 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2">
            <span class="px-2 py-0.5 bg-blue-100 text-blue-700 rounded-md text-[11px] font-bold">A</span>
            ${t.ex3PartA}
          </h3>
          <div class="space-y-3 mb-6">`;
        engToInd.forEach((item, i) => {
          html += `
            <div class="flex items-center gap-3 py-2 border-b border-slate-100">
              <span class="text-xs font-bold text-slate-400 w-6 text-right flex-shrink-0">${i+1}.</span>
              <span class="text-sm font-semibold text-slate-800 w-44 flex-shrink-0">${item.word}</span>
              <span class="text-slate-400">=</span>
              <div class="answer-line flex-grow"></div>
            </div>`;
        });
        html += `</div>`;
      }

      if (indToEng.length > 0) {
        html += `
          <h3 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2">
            <span class="px-2 py-0.5 bg-amber-100 text-amber-700 rounded-md text-[11px] font-bold">B</span>
            ${t.ex3PartB}
          </h3>
          <div class="space-y-3">`;
        indToEng.forEach((item, i) => {
          html += `
            <div class="flex items-center gap-3 py-2 border-b border-slate-100">
              <span class="text-xs font-bold text-slate-400 w-6 text-right flex-shrink-0">${i+1}.</span>
              <span class="text-sm font-semibold text-slate-800 w-44 flex-shrink-0">${item.indo}</span>
              <span class="text-slate-400">=</span>
              <div class="answer-line flex-grow"></div>
            </div>`;
        });
        html += `</div>`;
      }

      html += `
        </div>
      </div>`;

      /* ---------- LATIHAN 4: PILIHAN GANDA (jika >= 5 kata unik) ---------- */
      if (uniqueWords.length >= 5) {
        const mcItems = shuffle(uniqueWords, letter.charCodeAt(0) * 37).slice(0, Math.min(5, uniqueWords.length));

        html += `
      <div class="worksheet-card bg-white rounded-3xl border-2 border-slate-300 overflow-hidden shadow-md mb-8 print-break">
        <div class="bg-gradient-to-r from-rose-600 to-pink-600 text-white px-5 sm:px-6 py-4 flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center font-bold text-lg flex-shrink-0">4</div>
          <div>
            <h2 class="font-bold text-base sm:text-lg">${t.ex4Title}</h2>
            <p class="text-xs text-rose-200 mt-0.5 leading-relaxed">${t.ex4Desc}</p>
          </div>
        </div>
        <div class="p-5 sm:p-6 space-y-6">`;

        mcItems.forEach((item, qi) => {
          // Buat opsi jawaban (1 benar + 3 salah dari kosakata lain)
          let distractors = uniqueWords.filter(w => w.id !== item.id);
          distractors = shuffle(distractors, item.id * 11).slice(0, 3);
          let options = shuffle([item, ...distractors], item.id * 23);

          html += `
          <div class="border border-slate-200 rounded-2xl p-4 sm:p-5 bg-white shadow-xs">
            <div class="flex flex-col sm:flex-row items-start gap-4">
              <div class="w-24 h-24 sm:w-28 sm:h-28 bg-slate-100 rounded-2xl overflow-hidden flex-shrink-0 flex items-center justify-center border border-slate-200">
                <img src="${item.img}" alt="Soal ${qi+1}" class="w-full h-full object-contain"
                     onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'text-center text-slate-400 text-xs p-2\\'><i class=\\'fa-solid fa-image text-xl\\'></i></div>';">
              </div>
              <div class="flex-grow w-full">
                <p class="text-sm font-bold text-slate-800 mb-3">${t.ex4Question(qi+1)}</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">`;
          options.forEach((opt, oi) => {
            const optLabel = String.fromCharCode(65 + oi); // A, B, C, D
            html += `
                  <label class="flex items-center gap-2.5 py-2.5 px-3.5 border border-slate-200 rounded-xl hover:bg-slate-50/80 hover:border-slate-300 cursor-pointer transition-all">
                    <span class="w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center text-[11px] font-bold text-slate-600 flex-shrink-0">${optLabel}</span>
                    <span class="text-xs sm:text-sm text-slate-700 font-medium">${opt.word} <span class="text-slate-400">(${opt.indo})</span></span>
                  </label>`;
          });
          html += `
                </div>
              </div>
            </div>
          </div>`;
        });

        html += `
        </div>
      </div>`;
      }

      /* ---------- LATIHAN 5: SUSUN HURUF / ACAK KATA (jika >= 4 kata unik) ---------- */
      if (uniqueWords.length >= 4) {
        const scrambleItems = shuffle(uniqueWords, letter.charCodeAt(0) * 43).slice(0, Math.min(6, uniqueWords.length));

        html += `
      <div class="worksheet-card bg-white rounded-3xl border-2 border-slate-300 overflow-hidden shadow-md mb-8">
        <div class="bg-gradient-to-r from-amber-500 to-orange-500 text-white px-5 sm:px-6 py-4 flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center font-bold text-lg flex-shrink-0">${uniqueWords.length >= 5 ? '5' : '4'}</div>
          <div>
            <h2 class="font-bold text-base sm:text-lg">${t.ex5Title}</h2>
            <p class="text-xs text-orange-100 mt-0.5 leading-relaxed">${t.ex5Desc}</p>
          </div>
        </div>
        <div class="p-5 sm:p-6 space-y-4">`;

        scrambleItems.forEach((item, i) => {
          // Acak huruf dari kata
          const baseWord = item.word.replace(/\s*\(.*?\)\s*/g, '').replace(/\//g, ' / ');
          const letters_arr = shuffle(baseWord.split(''), item.id * 53);
          const scrambled = letters_arr.join(' ');

          html += `
          <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 py-3 border-b border-slate-100">
            <div class="flex items-center gap-3">
              <span class="text-xs font-bold text-slate-400 w-5 text-right flex-shrink-0">${i+1}.</span>
              <div class="flex-shrink-0">
                <span class="text-xs text-slate-500">${t.ex5Clue}</span>
                <span class="text-sm font-semibold text-amber-700 ml-1">${item.indo}</span>
              </div>
            </div>
            <div class="flex items-center gap-3 flex-grow ml-8 sm:ml-0">
              <div class="flex-shrink-0 px-3 py-1.5 bg-slate-100 rounded-xl border border-slate-200 shadow-2xs">
                <span class="font-mono text-sm font-bold text-slate-700 tracking-[0.3em] uppercase">${scrambled}</span>
              </div>
              <span class="text-slate-400">→</span>
              <div class="answer-line flex-grow"></div>
            </div>
          </div>`;
        });

        html += `
        </div>
      </div>`;
      }

      /* ---------- PANDUAN PENGUMPULAN KE PADLET ---------- */
      html += `
      <div class="worksheet-card bg-white rounded-3xl border-2 border-rose-300 overflow-hidden shadow-md mb-8">
        <div class="bg-gradient-to-r from-rose-600 to-rose-700 text-white px-5 sm:px-6 py-4 flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center font-bold text-xl flex-shrink-0">
            <i class="fa-solid fa-cloud-arrow-up"></i>
          </div>
          <div>
            <h2 class="font-bold text-base sm:text-lg">${t.padletGuideTitle}</h2>
            <p class="text-xs text-rose-100 mt-0.5 leading-relaxed">${t.padletGuideSub}</p>
          </div>
        </div>
        <div class="p-5 sm:p-6 space-y-3 text-xs sm:text-sm text-slate-700 leading-relaxed bg-rose-50/30">
          <div class="p-3.5 bg-white rounded-2xl border border-rose-100 flex items-start gap-3 shadow-xs">
            <span class="w-6 h-6 rounded-full bg-rose-600 text-white font-bold flex items-center justify-center text-xs flex-shrink-0 mt-0.5">1</span>
            <div>
              <strong class="text-slate-900">${t.padletStep1Title}</strong>
              <span class="ml-1">${t.padletStep1Desc}</span>
            </div>
          </div>
          <div class="p-3.5 bg-white rounded-2xl border border-rose-100 flex items-start gap-3 shadow-xs">
            <span class="w-6 h-6 rounded-full bg-rose-600 text-white font-bold flex items-center justify-center text-xs flex-shrink-0 mt-0.5">2</span>
            <div>
              <strong class="text-slate-900">${t.padletStep2Title}</strong>
              <span class="ml-1">${t.padletStep2Desc}</span>
            </div>
          </div>
          <div class="p-3.5 bg-white rounded-2xl border border-rose-100 flex items-start gap-3 shadow-xs">
            <span class="w-6 h-6 rounded-full bg-rose-600 text-white font-bold flex items-center justify-center text-xs flex-shrink-0 mt-0.5">3</span>
            <div>
              <strong class="text-slate-900">${t.padletStep3Title}</strong>
              <span class="ml-1">${t.padletStep3Desc}</span>
            </div>
          </div>
          <div class="p-3.5 bg-white rounded-2xl border border-rose-100 flex items-start gap-3 shadow-xs">
            <span class="w-6 h-6 rounded-full bg-rose-600 text-white font-bold flex items-center justify-center text-xs flex-shrink-0 mt-0.5">4</span>
            <div>
              <strong class="text-slate-900">${t.padletStep4Title}</strong>
              <span class="ml-1">${t.padletStep4Desc}</span>
            </div>
          </div>
          <div class="p-3.5 bg-white rounded-2xl border border-rose-100 flex items-start gap-3 shadow-xs">
            <span class="w-6 h-6 rounded-full bg-rose-600 text-white font-bold flex items-center justify-center text-xs flex-shrink-0 mt-0.5">5</span>
            <div>
              <strong class="text-slate-900">${t.padletStep5Title}</strong>
              <span class="ml-1">${t.padletStep5Desc}</span>
            </div>
          </div>

          <!-- Tombol Padlet di dalam Box Panduan -->
          <div class="no-print pt-3 text-center">
            <a href="https://padlet.com/amypratiwi2813/padlet-pengumpulan-lkpd-s023jz8eaysb80eyfvtf" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-rose-600 hover:bg-rose-700 text-white rounded-2xl font-bold text-sm shadow-md hover:shadow-lg transition-all cursor-pointer">
              <i class="fa-solid fa-arrow-up-right-from-square"></i>
              <span>${t.padletBtn}</span>
            </a>
          </div>
        </div>
      </div>`;

      /* ---------- FOOTER ---------- */
      html += `
      <div class="worksheet-card bg-white rounded-3xl border-2 border-slate-300 overflow-hidden shadow-md mb-8">
        <div class="p-5 sm:p-6 text-center">
          <div class="inline-flex items-center gap-2 text-slate-500 font-semibold text-sm">
            <i class="fa-solid fa-check-double text-emerald-500"></i>
            <span>${t.footerEnd}</span>
          </div>
          <p class="text-[11px] text-slate-400 mt-2">${t.footerCopy}</p>
        </div>
      </div>

      <!-- Tombol Navigasi (tidak tercetak) -->
      <div class="no-print flex flex-col sm:flex-row items-center justify-center gap-3 mb-12">
        <a href="index.html?view=menu" class="px-5 py-3 bg-slate-800 text-slate-200 hover:text-white rounded-2xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-slate-700 shadow-md transition-all">
          <i class="fa-solid fa-house text-amber-400"></i>
          <span>${t.btnBottomHome}</span>
        </a>
        <a href="index.html?view=kamus" class="px-6 py-3 bg-slate-900 text-white rounded-2xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-slate-800 shadow-md transition-all">
          <i class="fa-solid fa-arrow-left"></i>
          <span>${t.btnBottomBack}</span>
        </a>
        <button onclick="window.print()" class="px-6 py-3 bg-amber-600 text-white rounded-2xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-amber-700 shadow-md transition-all cursor-pointer">
          <i class="fa-solid fa-print"></i>
          <span>${t.btnBottomPrint}</span>
        </button>
        <a href="https://padlet.com/amypratiwi2813/padlet-pengumpulan-lkpd-s023jz8eaysb80eyfvtf" target="_blank" rel="noopener noreferrer" class="px-6 py-3 bg-rose-600 text-white rounded-2xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-rose-700 shadow-md transition-all">
          <i class="fa-solid fa-arrow-up-right-from-square"></i>
          <span>${t.btnBottomPadlet}</span>
        </a>
      </div>`;

      root.innerHTML = html;
    }

    /* =================================================================

    window.onload = build;
  </script>

    // Acak array (Fisher-Yates) — seeded agar konsisten per huruf
    function shuffle(arr, seed) {
      const a = [...arr];
      let s = seed || 1;
      function rng() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Ambil subset unik berdasarkan properti (menghindari duplikat terjemahan)
    function uniqueBy(arr, key) {
      const seen = new Set();
      return arr.filter(item => {
        const val = item[key];
        if (seen.has(val)) return false;
        seen.add(val);
        return true;
      });
    }

            <div>
              <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Nama Lengkap</label>
              <div class="mt-1.5 answer-line"></div>
            </div>
            <div>
              <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Kelas / Kelompok</label>
              <div class="mt-1.5 answer-line"></div>
            </div>
            <div>
              <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Tanggal</label>
              <div class="mt-1.5 answer-line"></div>
            </div>
          </div>
        </div>

        <!-- Petunjuk -->
        <div class="p-5 sm:p-6">
          <div class="bg-amber-50 border border-amber-200 rounded-xl p-4">
            <h3 class="font-bold text-amber-800 text-sm flex items-center gap-2">
              <i class="fa-solid fa-circle-info"></i> Petunjuk Pengerjaan
            </h3>
            <ul class="mt-2 text-[13px] text-slate-700 space-y-1 leading-relaxed">
              <li>• Kerjakan semua latihan berikut dengan teliti dan jujur.</li>
              <li>• Gunakan <strong>Kamus Kolok Digital</strong> sebagai bahan referensi belajar.</li>
              <li>• Lembar kerja ini mencakup <strong>${allWords.length} kosakata</strong> isyarat Kolok berawalan huruf <strong>${letter}</strong>.</li>
            </ul>
          </div>
        </div>
      </div>`;

      /* ---------- LATIHAN 1: IDENTIFIKASI GAMBAR ---------- */
      const imgItems = shuffle(allWords, letter.charCodeAt(0) * 7);
      const showCount = Math.min(imgItems.length, 8); // Maks 8 gambar agar tidak terlalu panjang
      const selectedImgs = imgItems.slice(0, showCount);

      html += `
      <div class="worksheet-card bg-white rounded-2xl border-2 border-slate-300 overflow-hidden shadow-md mb-8">
        <div class="bg-blue-600 text-white px-5 py-4 flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center font-bold text-lg">1</div>
          <div>
            <h2 class="font-bold text-base">Identifikasi Gambar Isyarat</h2>
            <p class="text-xs text-blue-100">Perhatikan gambar isyarat Kolok berikut, lalu tuliskan nama kata dalam <strong>Bahasa Inggris</strong> dan <strong>Bahasa Indonesia</strong>.</p>
          </div>
        </div>
        <div class="p-5 sm:p-6">
          <div class="grid grid-cols-2 ${showCount > 4 ? 'sm:grid-cols-4' : 'sm:grid-cols-' + Math.min(showCount, 4)} gap-4 sm:gap-5">`;

      selectedImgs.forEach((item, i) => {
        html += `
            <div class="border border-slate-200 rounded-xl overflow-hidden">
              <div class="bg-slate-100 aspect-square flex items-center justify-center p-1">
                <img src="${item.img}" alt="Isyarat ${i+1}" class="w-full h-full object-contain rounded-lg"
                     onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'text-center text-slate-400 text-xs p-4\\'><i class=\\'fa-solid fa-image text-2xl mb-1\\'></i><br>Gambar ${i+1}</div>';">
              </div>
              <div class="p-3 space-y-2">
                <div>
                  <span class="text-[10px] font-bold text-slate-400 uppercase">Inggris:</span>
                  <div class="answer-line mt-0.5"></div>
                </div>
                <div>
                  <span class="text-[10px] font-bold text-slate-400 uppercase">Indonesia:</span>
                  <div class="answer-line mt-0.5"></div>
                </div>
              </div>
            </div>`;
      });

      html += `
          </div>
        </div>
      </div>`;

      /* ---------- LATIHAN 2: JODOHKAN / MENCOCOKKAN ---------- */
      if (uniqueWords.length >= 3) {
        const matchCount = Math.min(uniqueWords.length, 10);
        const matchItems = shuffle(uniqueWords, letter.charCodeAt(0) * 13).slice(0, matchCount);
        const leftCol = [...matchItems]; // urutan asli
        const rightCol = shuffle(matchItems, letter.charCodeAt(0) * 31); // diacak

        html += `
      <div class="worksheet-card bg-white rounded-2xl border-2 border-slate-300 overflow-hidden shadow-md mb-8 print-break">
        <div class="bg-emerald-600 text-white px-5 py-4 flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center font-bold text-lg">2</div>
          <div>
            <h2 class="font-bold text-base">Jodohkan Kata</h2>
            <p class="text-xs text-emerald-100">Hubungkan kata <strong>Bahasa Inggris</strong> di kolom kiri dengan terjemahan <strong>Bahasa Indonesia</strong> di kolom kanan dengan menarik garis.</p>
          </div>
        </div>
        <div class="p-5 sm:p-6">
          <div class="max-w-xl mx-auto">
            <div class="flex justify-between items-start">
              <!-- Kolom Kiri: Bahasa Inggris -->
              <div class="space-y-3 text-left w-[42%]">
                <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2 text-center">Bahasa Inggris</div>`;
        leftCol.forEach((item, i) => {
          html += `
                <div class="flex items-center gap-2 py-2 px-3 bg-blue-50 border border-blue-200 rounded-lg">
                  <span class="text-xs font-bold text-blue-400">${i+1}.</span>
                  <span class="text-sm font-semibold text-slate-800 flex-grow">${item.word}</span>
                  <span class="matching-dot"></span>
                </div>`;
        });
        html += `
              </div>
              <!-- Garis Tengah -->
              <div class="flex-shrink-0 w-[10%] flex items-center justify-center">
                <div class="h-full border-l-2 border-dashed border-slate-200 min-h-[200px]"></div>
              </div>
              <!-- Kolom Kanan: Bahasa Indonesia -->
              <div class="space-y-3 text-right w-[42%]">
                <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2 text-center">Bahasa Indonesia</div>`;
        rightCol.forEach((item, i) => {
          const abc = String.fromCharCode(97 + i); // a, b, c, ...
          html += `
                <div class="flex items-center gap-2 py-2 px-3 bg-amber-50 border border-amber-200 rounded-lg">
                  <span class="matching-dot"></span>
                  <span class="text-sm font-semibold text-slate-800 flex-grow text-left">${item.indo}</span>
                  <span class="text-xs font-bold text-amber-400">${abc}.</span>
                </div>`;
        });
        html += `
              </div>
            </div>
          </div>
        </div>
      </div>`;
      }

      /* ---------- LATIHAN 3: ISI TERJEMAHAN ---------- */
      const transItems = shuffle(uniqueWords, letter.charCodeAt(0) * 19);
      // Separuh: Inggris → Indonesia, separuh: Indonesia → Inggris
      const half = Math.ceil(transItems.length / 2);
      const engToInd = transItems.slice(0, half);
      const indToEng = transItems.slice(half);

      html += `
      <div class="worksheet-card bg-white rounded-2xl border-2 border-slate-300 overflow-hidden shadow-md mb-8 ${uniqueWords.length >= 3 ? '' : 'print-break'}">
        <div class="bg-violet-600 text-white px-5 py-4 flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center font-bold text-lg">${uniqueWords.length >= 3 ? '3' : '2'}</div>
          <div>
            <h2 class="font-bold text-base">Terjemahkan Kosakata</h2>
            <p class="text-xs text-violet-200">Tuliskan terjemahan yang tepat pada kolom yang tersedia.</p>
          </div>
        </div>
        <div class="p-5 sm:p-6">`;

      if (engToInd.length > 0) {
        html += `
          <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
            <span class="px-2 py-0.5 bg-blue-100 text-blue-700 rounded text-[11px] font-bold">A</span>
            Terjemahkan ke Bahasa Indonesia
          </h3>
          <div class="space-y-3 mb-6">`;
        engToInd.forEach((item, i) => {
          html += `
            <div class="flex items-center gap-3 py-2 border-b border-slate-100">
              <span class="text-xs font-bold text-slate-400 w-6 text-right flex-shrink-0">${i+1}.</span>
              <span class="text-sm font-semibold text-slate-800 w-44 flex-shrink-0">${item.word}</span>
              <span class="text-slate-400">=</span>
              <div class="answer-line flex-grow"></div>
            </div>`;
        });
        html += `</div>`;
      }

      if (indToEng.length > 0) {
        html += `
          <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
            <span class="px-2 py-0.5 bg-amber-100 text-amber-700 rounded text-[11px] font-bold">B</span>
            Terjemahkan ke Bahasa Inggris
          </h3>
          <div class="space-y-3">`;
        indToEng.forEach((item, i) => {
          html += `
            <div class="flex items-center gap-3 py-2 border-b border-slate-100">
              <span class="text-xs font-bold text-slate-400 w-6 text-right flex-shrink-0">${i+1}.</span>
              <span class="text-sm font-semibold text-slate-800 w-44 flex-shrink-0">${item.indo}</span>
              <span class="text-slate-400">=</span>
              <div class="answer-line flex-grow"></div>
            </div>`;
        });
        html += `</div>`;
      }

      html += `
        </div>
      </div>`;

      /* ---------- LATIHAN 4: PILIHAN GANDA (jika >= 5 kata unik) ---------- */
      if (uniqueWords.length >= 5) {
        const mcItems = shuffle(uniqueWords, letter.charCodeAt(0) * 37).slice(0, Math.min(5, uniqueWords.length));

        html += `
      <div class="worksheet-card bg-white rounded-2xl border-2 border-slate-300 overflow-hidden shadow-md mb-8 print-break">
        <div class="bg-rose-600 text-white px-5 py-4 flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center font-bold text-lg">4</div>
          <div>
            <h2 class="font-bold text-base">Pilihan Ganda</h2>
            <p class="text-xs text-rose-200">Perhatikan gambar isyarat, kemudian pilih jawaban yang paling tepat.</p>
          </div>
        </div>
        <div class="p-5 sm:p-6 space-y-6">`;

        mcItems.forEach((item, qi) => {
          // Buat opsi jawaban (1 benar + 3 salah dari kosakata lain)
          let distractors = uniqueWords.filter(w => w.id !== item.id);
          distractors = shuffle(distractors, item.id * 11).slice(0, 3);
          let options = shuffle([item, ...distractors], item.id * 23);

          html += `
          <div class="border border-slate-200 rounded-xl p-4">
            <div class="flex items-start gap-4">
              <div class="w-24 h-24 sm:w-28 sm:h-28 bg-slate-100 rounded-xl overflow-hidden flex-shrink-0 flex items-center justify-center">
                <img src="${item.img}" alt="Soal ${qi+1}" class="w-full h-full object-contain"
                     onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'text-center text-slate-400 text-xs p-2\\'><i class=\\'fa-solid fa-image text-xl\\'></i></div>';">
              </div>
              <div class="flex-grow">
                <p class="text-sm font-bold text-slate-800 mb-3">${qi+1}. Gambar isyarat di samping memiliki arti…</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">`;
          options.forEach((opt, oi) => {
            const optLabel = String.fromCharCode(65 + oi); // A, B, C, D
            html += `
                  <label class="flex items-center gap-2 py-2 px-3 border border-slate-200 rounded-lg hover:bg-slate-50 cursor-pointer transition-colors">
                    <span class="w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center text-[11px] font-bold text-slate-500 flex-shrink-0">${optLabel}</span>
                    <span class="text-sm text-slate-700">${opt.word} <span class="text-slate-400">(${opt.indo})</span></span>
                  </label>`;
          });
          html += `
                </div>
              </div>
            </div>
          </div>`;
        });

        html += `
        </div>
      </div>`;
      }

      /* ---------- LATIHAN 5: SUSUN HURUF / ACAK KATA (jika >= 4 kata unik) ---------- */
      if (uniqueWords.length >= 4) {
        const scrambleItems = shuffle(uniqueWords, letter.charCodeAt(0) * 43).slice(0, Math.min(6, uniqueWords.length));

        html += `
      <div class="worksheet-card bg-white rounded-2xl border-2 border-slate-300 overflow-hidden shadow-md mb-8">
        <div class="bg-orange-500 text-white px-5 py-4 flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center font-bold text-lg">${uniqueWords.length >= 5 ? '5' : '4'}</div>
          <div>
            <h2 class="font-bold text-base">Susun Huruf</h2>
            <p class="text-xs text-orange-100">Huruf-huruf di bawah diacak. Susun kembali menjadi kata Bahasa Inggris yang benar! Petunjuk terjemahan Indonesia diberikan.</p>
          </div>
        </div>
        <div class="p-5 sm:p-6 space-y-4">`;

        scrambleItems.forEach((item, i) => {
          // Acak huruf dari kata
          const baseWord = item.word.replace(/\s*\(.*?\)\s*/g, '').replace(/\//g, ' / ');
          const letters_arr = shuffle(baseWord.split(''), item.id * 53);
          const scrambled = letters_arr.join(' ');

          html += `
          <div class="flex items-center gap-4 py-3 border-b border-slate-100">
            <span class="text-xs font-bold text-slate-400 w-6 text-right flex-shrink-0">${i+1}.</span>
            <div class="flex-shrink-0">
              <span class="text-xs text-slate-500">Petunjuk:</span>
              <span class="text-sm font-semibold text-amber-700 ml-1">${item.indo}</span>
            </div>
            <div class="flex-shrink-0 px-3 py-1.5 bg-slate-100 rounded-lg border border-slate-200">
              <span class="font-mono text-sm font-bold text-slate-600 tracking-[0.3em] uppercase">${scrambled}</span>
            </div>
            <span class="text-slate-400">→</span>
            <div class="answer-line flex-grow"></div>
          </div>`;
        });

        html += `
        </div>
      </div>`;
      }

      /* ---------- FOOTER ---------- */
      html += `
      <div class="worksheet-card bg-white rounded-2xl border-2 border-slate-300 overflow-hidden shadow-md mb-8">
        <div class="p-5 sm:p-6 text-center">
          <div class="inline-flex items-center gap-2 text-slate-400 text-sm">
            <i class="fa-solid fa-check-double text-emerald-500"></i>
            <span>Akhir Lembar Kerja — LKPD ${String(lkpdNo).padStart(2,'0')} Huruf ${letter}</span>
          </div>
          <p class="text-[11px] text-slate-400 mt-2">Kamus Kolok Digital © Bahasa Isyarat Desa Bengkala, Buleleng, Bali</p>
        </div>
      </div>

      <!-- Tombol Navigasi (tidak tercetak) -->
      <div class="no-print flex flex-col sm:flex-row items-center justify-center gap-3 mb-12">
        <a href="index.html" class="px-6 py-3 bg-slate-900 text-white rounded-xl font-bold text-sm flex items-center gap-2 hover:bg-slate-800 transition-colors">
          <i class="fa-solid fa-arrow-left"></i>
          Kembali ke Kamus
        </a>
        <button onclick="window.print()" class="px-6 py-3 bg-amber-600 text-white rounded-xl font-bold text-sm flex items-center gap-2 hover:bg-amber-700 transition-colors">
          <i class="fa-solid fa-print"></i>
          Cetak Lembar Kerja
        </button>
        <a href="https://padlet.com/amypratiwi2813/padlet-pengumpulan-lkpd-s023jz8eaysb80eyfvtf" target="_blank" rel="noopener noreferrer" class="px-6 py-3 bg-rose-600 text-white rounded-xl font-bold text-sm flex items-center gap-2 hover:bg-rose-700 transition-colors">
          <i class="fa-solid fa-arrow-up-right-from-square"></i>
          Buka Padlet
        </a>
      </div>`;

      root.innerHTML = html;
    }

    /* =================================================================
       JALANKAN SAAT HALAMAN DIMUAT
       ================================================================= */
    window.onload = build;
  </script>
</body>
</html>
